name: Build Prostaya All-in-One

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build_all_in_one.py'
      - '.github/workflows/build-all-in-one.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single Apps Script file
        run: python3 scripts/build_all_in_one.py

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Prostaya-All-in-One-dev8.gs
          if git diff --cached --quiet; then
            echo "All-in-One file is already current."
            exit 0
          fi
          git commit -m "Build Prostaya All-in-One dev8"
          git push
